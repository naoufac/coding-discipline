<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Naoufal's &amp; AI agent Jasmine coding discipline</title>
  <desc id="d">Three rules that keep AI coding agents honest, shown as three cards under a night sky with a sun over the sea.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B101B"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B6FE8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B101B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B4A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>

  <g fill="#E8F1FF">
    <circle cx="640" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="720" cy="130" r="1.2" opacity="0.5"/>
    <circle cx="810" cy="52" r="1.8" opacity="0.8"/>
    <circle cx="890" cy="110" r="1.2" opacity="0.6"/>
    <circle cx="960" cy="44" r="1.4" opacity="0.7"/>
    <circle cx="1190" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="1230" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="1170" cy="210" r="1.4" opacity="0.6"/>
    <circle cx="990" cy="200" r="1.1" opacity="0.5"/>
    <circle cx="560" cy="150" r="1.1" opacity="0.4"/>
  </g>

  <circle cx="1080" cy="140" r="130" fill="url(#glow)"/>
  <circle cx="1080" cy="140" r="54" fill="#FF6B4A"/>

  <rect y="470" width="1280" height="170" fill="url(#sea)"/>
  <line x1="0" y1="470.5" x2="1280" y2="470.5" stroke="#E8F1FF" stroke-opacity="0.25"/>
  <g fill="none" stroke="#E8F1FF" stroke-linecap="round" stroke-opacity="0.18" stroke-width="2">
    <path d="M0 500 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
    <path d="M-40 540 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke-opacity="0.12"/>
  </g>
  <g fill="#FF6B4A">
    <rect x="1040" y="482" width="80" height="4" rx="2" opacity="0.7"/>
    <rect x="1052" y="498" width="56" height="4" rx="2" opacity="0.55"/>
    <rect x="1062" y="514" width="36" height="4" rx="2" opacity="0.4"/>
    <rect x="1070" y="530" width="20" height="4" rx="2" opacity="0.25"/>
  </g>

  <text x="80" y="92" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2.4" fill="#FF6B4A">NAOUFAL'S &amp; AI AGENT JASMINE</text>
  <text x="78" y="160" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="66" font-weight="600" fill="#FFFFFF">Coding Discipline</text>
  <text x="80" y="208" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#C9D6EE">Three rules that keep AI coding agents honest.</text>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(80 260)">
      <rect width="352" height="176" rx="4" fill="#FFFFFF"/>
      <rect width="352" height="4" rx="2" fill="#1B6FE8"/>
      <text x="28" y="56" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#FF6B4A">1</text>
      <text x="28" y="94" font-size="18" font-weight="700" fill="#121826"><tspan x="28">Study the technology</tspan><tspan x="28" dy="25">before touching the code.</tspan></text>
      <text x="28" y="152" font-size="14" fill="#4A5568">If you do not understand it, do not edit it.</text>
    </g>
    <g transform="translate(464 260)">
      <rect width="352" height="176" rx="4" fill="#FFFFFF"/>
      <rect width="352" height="4" rx="2" fill="#1B6FE8"/>
      <text x="28" y="56" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#FF6B4A">2</text>
      <text x="28" y="94" font-size="18" font-weight="700" fill="#121826"><tspan x="28">A job can take more</tspan><tspan x="28" dy="25">than one run.</tspan></text>
      <text x="28" y="152" font-size="14" fill="#4A5568">A todo list is a must. Never fake "done".</text>
    </g>
    <g transform="translate(848 260)">
      <rect width="352" height="176" rx="4" fill="#FFFFFF"/>
      <rect width="352" height="4" rx="2" fill="#1B6FE8"/>
      <text x="28" y="56" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#FF6B4A">3</text>
      <text x="28" y="94" font-size="18" font-weight="700" fill="#121826"><tspan x="28">Never trust a subagent.</tspan><tspan x="28" dy="25">Always give him the context.</tspan></text>
      <text x="28" y="152" font-size="14" fill="#4A5568">Verify side effects yourself.</text>
    </g>
  </g>

  <g transform="translate(80 586)">
    <circle cx="18" cy="0" r="18" fill="#1B6FE8"/>
    <circle cx="18" cy="-2" r="6" fill="#FF6B4A"/>
    <path d="M4 6 q7 -4 14 0 t14 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="6" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#FFFFFF">Naoufal &amp; Jasmine</text>
  </g>
  <text x="1200" y="592" text-anchor="end" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#C9D6EE">HTTP 200 is not a person finishing the job.</text>
</svg>
